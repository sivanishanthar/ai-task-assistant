name: AI Task Assistant - Automated Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Run Automated Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Offline Tests with Coverage (Mocked OpenAI)
        env:
          OPENAI_API_KEY: ""
        run: node --test --experimental-test-coverage tests/*.test.js
